<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note to Post</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --text: #1d1c1a; --muted: #6b6860; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121311; --text: #e9e8e4; --muted: #9c9a92; } }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
    main { max-width: 520px; margin: 20vh auto 0; padding: 0 16px; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Note to Post</h1>
    <p>This runs inside Telegram. Send notes to the bot and the ones worth a post come back as LinkedIn drafts. Nothing is posted anywhere automatically.</p>
  </main>
</body>
</html>
